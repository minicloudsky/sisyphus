apiVersion: v1
kind: Namespace
metadata:
  name: sisyphus
  labels:
    app.kubernetes.io/part-of: sisyphus
    # Enforce Kubernetes Pod Security Standards — Restricted profile.
    # Remove or downgrade to "baseline" if third-party sidecar injection
    # (e.g. Istio, Linkerd) requires additional capabilities.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: latest
---
# Default resource boundaries for any pod that does not set its own limits.
# Prevents runaway containers from starving the node.
apiVersion: v1
kind: LimitRange
metadata:
  name: sisyphus-defaults
  namespace: sisyphus
  labels:
    app.kubernetes.io/part-of: sisyphus
spec:
  limits:
    - type: Container
      default:
        cpu: "500m"
        memory: "512Mi"
      defaultRequest:
        cpu: "100m"
        memory: "128Mi"
      max:
        cpu: "4"
        memory: "4Gi"
