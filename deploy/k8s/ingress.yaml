# ─────────────────────────────────────────────────────────────────────────────
# Sisyphus — Ingress
#
# Prerequisites:
#   - nginx ingress controller installed in the cluster
#   - cert-manager installed with a ClusterIssuer named "letsencrypt-prod"
#     (see: https://cert-manager.io/docs/configuration/acme/)
#
# Replace <YOUR_DOMAIN> with your actual domain before applying.
# Example: sisyphus.example.com
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sisyphus
  namespace: sisyphus
  labels:
    app.kubernetes.io/name: sisyphus
    app.kubernetes.io/part-of: sisyphus
  annotations:
    # ── TLS certificate provisioning via cert-manager ─────────────────────
    cert-manager.io/cluster-issuer: "letsencrypt-prod"

    # ── nginx ingress tuning ──────────────────────────────────────────────
    nginx.ingress.kubernetes.io/proxy-body-size: "32m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "10"

    # Enable gzip compression for text assets
    nginx.ingress.kubernetes.io/enable-compression: "true"

    # Security headers
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "X-Frame-Options: DENY";
      more_set_headers "X-Content-Type-Options: nosniff";
      more_set_headers "X-XSS-Protection: 1; mode=block";
      more_set_headers "Referrer-Policy: strict-origin-when-cross-origin";

    # Force HTTPS redirect
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - <YOUR_DOMAIN>
      secretName: sisyphus-tls
  rules:
    - host: <YOUR_DOMAIN>
      http:
        paths:
          # ── API and backend routes → sisyphus-server ──────────────────────
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: sisyphus-server
                port:
                  name: http
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: sisyphus-server
                port:
                  name: http
          # ── Everything else → SPA frontend ───────────────────────────────
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sisyphus-web
                port:
                  name: http
