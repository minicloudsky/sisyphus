# ─────────────────────────────────────────────────────────────────────────────
# Sisyphus — Frontend Web (nginx SPA)
#
# Resources in this file:
#   ServiceAccount, Deployment, Service
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sisyphus-web
  namespace: sisyphus
  labels:
    app.kubernetes.io/name: sisyphus-web
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: sisyphus
automountServiceAccountToken: false
---
# ── Deployment ────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sisyphus-web
  namespace: sisyphus
  labels:
    app.kubernetes.io/name: sisyphus-web
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: sisyphus
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: sisyphus-web
  # Zero-downtime rolling update: surge one new pod before taking old one down.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sisyphus-web
        app.kubernetes.io/component: web
        app.kubernetes.io/part-of: sisyphus
    spec:
      serviceAccountName: sisyphus-web
      automountServiceAccountToken: false

      # ── Pod-level security ─────────────────────────────────────────────────
      securityContext:
        runAsNonRoot: true
        runAsUser: 101        # nginx official image uses uid 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault

      # ── High-availability: spread pods across zones and nodes ──────────────
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: sisyphus-web
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: sisyphus-web

      terminationGracePeriodSeconds: 30

      containers:
        - name: web
          image: minicloudsky/sisyphus-web:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
              protocol: TCP

          # ── Container-level security ───────────────────────────────────────
          # nginx needs to write to /var/cache/nginx and /var/run;
          # readOnlyRootFilesystem is enforced with emptyDir mounts below.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

          # ── Probes ─────────────────────────────────────────────────────────
          startupProbe:
            httpGet:
              path: /index.html
              port: http
            failureThreshold: 10
            periodSeconds: 5

          readinessProbe:
            httpGet:
              path: /index.html
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 3

          livenessProbe:
            httpGet:
              path: /index.html
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            failureThreshold: 5
            timeoutSeconds: 3

          # ── Resources ──────────────────────────────────────────────────────
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              memory: "256Mi"

          volumeMounts:
            # nginx runtime write paths (required with readOnlyRootFilesystem)
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
            - name: tmp
              mountPath: /tmp

      volumes:
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
# ── Service ───────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: sisyphus-web
  namespace: sisyphus
  labels:
    app.kubernetes.io/name: sisyphus-web
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: sisyphus
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: sisyphus-web
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
