syntax = "proto3";

package api.v1;

option go_package = "sisyphus/server/api/v1;v1";

import "google/api/annotations.proto";

// 认证服务
service AuthService {
  // 用户注册
  rpc Register(RegisterRequest) returns (RegisterResponse) {
    option (google.api.http) = {
      post: "/api/v1/auth/register"
      body: "*"
    };
  }
  // 用户登录
  rpc Login(LoginRequest) returns (LoginResponse) {
    option (google.api.http) = {
      post: "/api/v1/auth/login"
      body: "*"
    };
  }
  // 更新用户信息
  rpc UpdateUser(UpdateUserRequest) returns (UpdateUserResponse) {
    option (google.api.http) = {
      put: "/api/v1/auth/user"
      body: "*"
    };
  }
}

// 注册请求
message RegisterRequest {
  string username = 1;
  string password = 2;
  string email = 3;
  string real_name = 4;
  string phone = 5;
  string department = 6;
}

// 注册响应
message RegisterResponse {
  int32 code = 1;
  string message = 2;
  User data = 3;
}

// 登录请求
message LoginRequest {
  string username = 1;
  string password = 2;
}

// 登录响应
message LoginResponse {
  int32 code = 1;
  string message = 2;
  LoginData data = 3;
}

// 登录数据
message LoginData {
  string token = 1;
  User user = 2;
}

// 用户信息
message User {
  uint64 id = 1;
  string username = 2;
  string email = 3;
  string real_name = 4;
  string phone = 5;
  string department = 6;
  int32 status = 7;
}

// 更新用户请求
message UpdateUserRequest {
  string email = 1;
  string real_name = 2;
  string phone = 3;
  string department = 4;
  string position = 5;
  string description = 6;
}

// 更新用户响应
message UpdateUserResponse {
  int32 code = 1;
  string message = 2;
  User data = 3;
}
