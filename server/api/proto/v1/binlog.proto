syntax = "proto3";

package api.v1;

option go_package = "sisyphus/server/api/v1;v1";

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
import "proto/v1/common.proto";

// Binlog回滚服务
service BinlogService {
  // 解析Binlog
  rpc ParseBinlog(ParseBinlogRequest) returns (ParseBinlogResponse) {
    option (google.api.http) = {
      post: "/api/v1/binlog/parse"
      body: "*"
    };
  }
  // 获取回滚工单列表
  rpc ListBinlogOrders(ListBinlogOrdersRequest) returns (ListBinlogOrdersResponse) {
    option (google.api.http) = {
      get: "/api/v1/binlog/orders"
    };
  }
  // 获取回滚工单详情
  rpc GetBinlogOrder(GetBinlogOrderRequest) returns (GetBinlogOrderResponse) {
    option (google.api.http) = {
      get: "/api/v1/binlog/orders/{id}"
    };
  }
  // 获取回滚SQL列表
  rpc GetRollbackSQLs(GetRollbackSQLsRequest) returns (GetRollbackSQLsResponse) {
    option (google.api.http) = {
      get: "/api/v1/binlog/orders/{id}/sqls"
    };
  }
}

// 解析Binlog请求
message ParseBinlogRequest {
  uint64 instance_id = 1;
  string database_name = 2;
  google.protobuf.Timestamp start_time = 3;
  google.protobuf.Timestamp stop_time = 4;
  string binlog_file = 5;
  repeated string table_list = 6;
}

// 解析Binlog响应
message ParseBinlogResponse {
  int32 code = 1;
  string message = 2;
  ParseBinlogData data = 3;
}

// 解析Binlog数据
message ParseBinlogData {
  uint64 order_id = 1;
  string work_id = 2;
  string message = 3;
}

// 获取回滚工单列表请求
message ListBinlogOrdersRequest {
  PageRequest page_request = 1;
  optional uint64 instance_id = 2;
}

// 获取回滚工单列表响应
message ListBinlogOrdersResponse {
  int32 code = 1;
  string message = 2;
  repeated BinlogRollbackOrder list = 3;
  PageResponse page_response = 4;
}

// Binlog回滚工单
message BinlogRollbackOrder {
  uint64 id = 1;
  string work_id = 2;
  uint64 instance_id = 3;
  string database_name = 4;
  google.protobuf.Timestamp start_time = 5;
  google.protobuf.Timestamp stop_time = 6;
  string binlog_file = 7;
  repeated string table_list = 8;
  int32 status = 9; // 0: 解析中, 1: 解析完成, 2: 解析失败
  uint64 submitter_id = 10;
  google.protobuf.Timestamp created_at = 11;
  google.protobuf.Timestamp updated_at = 12;
}

// 获取回滚工单详情请求
message GetBinlogOrderRequest {
  uint64 id = 1;
}

// 获取回滚工单详情响应
message GetBinlogOrderResponse {
  int32 code = 1;
  string message = 2;
  BinlogRollbackOrder data = 3;
}

// 获取回滚SQL列表请求
message GetRollbackSQLsRequest {
  uint64 id = 1;
}

// 获取回滚SQL列表响应
message GetRollbackSQLsResponse {
  int32 code = 1;
  string message = 2;
  repeated RollbackSQL list = 3;
}

// 回滚SQL
message RollbackSQL {
  uint64 id = 1;
  uint64 order_id = 2;
  string table_name = 3;
  string sql_type = 4; // INSERT, UPDATE, DELETE
  string original_sql = 5;
  string rollback_sql = 6;
  google.protobuf.Timestamp execute_time = 7;
  google.protobuf.Timestamp created_at = 8;
}
