name: Docker — Base Image

permissions:
  contents: read

concurrency:
  group: docker-base-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [master, main]
    paths:
      - 'server/Dockerfile.base'
  workflow_dispatch:
    inputs:
      ghost_version:
        description: 'gh-ost version'
        required: false
        default: '1.1.6'
      goinception_version:
        description: 'goInception version'
        required: false
        default: '1.3.0'
      pt_version:
        description: 'Percona Toolkit version'
        required: false
        default: '3.6.0'
      image_tag:
        description: 'Base image tag to publish (e.g. 1.0.0)'
        required: true
        default: 'latest'

jobs:
  build-base:
    name: Build & push base image
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve image tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.image_tag }}" >> $GITHUB_OUTPUT
          else
            echo "value=sha-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
          fi

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: server
          file: server/Dockerfile.base
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/sisyphus-server-base:${{ steps.tag.outputs.value }}
            ${{ secrets.DOCKERHUB_USERNAME }}/sisyphus-server-base:latest
          build-args: |
            GHOST_VERSION=${{ inputs.ghost_version || '1.1.6' }}
            GOINCEPTION_VERSION=${{ inputs.goinception_version || '1.3.0' }}
            PT_VERSION=${{ inputs.pt_version || '3.6.0' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "### Base image published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "${{ secrets.DOCKERHUB_USERNAME }}/sisyphus-server-base:${{ steps.tag.outputs.value }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "To pin this version in \`server/Dockerfile\`:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "ARG BASE_IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/sisyphus-server-base:${{ steps.tag.outputs.value }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
